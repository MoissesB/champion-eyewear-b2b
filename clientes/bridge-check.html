<!doctype html><html lang="es"><meta charset="utf-8"><title>Champion bridge check</title>
<main><h1>Champion bridge check</h1><pre id="status">inicial</pre></main>
<script>
const status=document.getElementById('status');
const nonce=crypto.randomUUID();
const frame=document.createElement('iframe');
frame.title='Champion secure gateway';
frame.style='width:700px;height:250px;border:1px solid #ccc';
frame.src='https://script.google.com/macros/s/AKfycbxhbdPn9jijehZfBVlzW2b4jC2OIleqFXpwREhoXnbK2TzfWD0RVN6ZmJItiJfFGpoL/exec?nonce='+nonce;
frame.addEventListener('load',()=>status.textContent+='\nframe load event');
frame.addEventListener('error',()=>status.textContent+='\nframe error event');
addEventListener('message',event=>{status.textContent+='\nmessage origin='+event.origin+' ready='+event.data?.ready+' nonce='+String(event.data?.nonce===nonce)+' ports='+event.ports.length;});
document.body.append(frame);
status.textContent+='\nframe appended';
</script></html>
